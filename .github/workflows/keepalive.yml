# Render 무료 서버는 15분 동안 아무도 없으면 잠들고, 다음 손님이 1분 가까이 기다리게 된다.
# 10분마다 깨워서 처음 온 사람도 바로 들어올 수 있게 한다.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 90 https://mia-escape.kr/health || true
