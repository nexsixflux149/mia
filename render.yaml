# Render.com 무료 웹 서비스 설정 (GitHub 저장소 연결 후 "New > Blueprint" 로 배포)
services:
  - type: web
    name: gwimun
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 기록(이어하기·랭킹·하트)을 남기려면 무료 Postgres(Neon 등) 연결 주소를 넣는다. 배포할 때 Render가 물어본다.
      - key: DATABASE_URL
        sync: false
